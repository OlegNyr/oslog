# Builds the Windows portable .exe on windows-latest.
#  - push to main (or Actions → build → Run workflow): replaces the single
#    GitHub Release "latest" with the new .exe, so the download link never
#    changes: releases/download/latest/oslog-portable.exe;
#  - pull request: build only, the .exe attached to the run for a day.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a newer push to main supersedes a build still running
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # replace the "latest" release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist
        env:
          # no code-signing certificate yet — don't look for one
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Attach to the run (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: oslog-windows
          path: dist/oslog-portable.exe
          retention-days: 1
          if-no-files-found: error
      - name: Replace the "latest" release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/oslog-portable.exe \
            --target "$GITHUB_SHA" --latest \
            --title "oslog — последняя сборка" \
            --notes "Сборка из main, коммит ${GITHUB_SHA::7}."
